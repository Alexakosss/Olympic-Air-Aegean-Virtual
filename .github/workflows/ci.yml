name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: ./package.json

      - name: Install frontend dependencies
        run: pnpm ci

      - name: Lint frontend
        run: pnpm lint
